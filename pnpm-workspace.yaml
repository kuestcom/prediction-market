minimumReleaseAge: 1440
shellEmulator: true
blockExoticSubdeps: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # semver 6 is required by Babel/Next/Sentry transitive tooling.
  - semver@6.3.1
  # slow-redact is pinned through pino -> @walletconnect/logger.
  - slow-redact@0.3.2
  # tinyexec is required by Vitest/lint-staged/Fumadocs tooling.
  - tinyexec@1.2.2

allowBuilds:
  '@parcel/watcher': false
  '@reown/appkit': false
  '@sentry/cli': true
  '@swc/core': true
  bufferutil: false
  esbuild: true
  keccak: false
  sharp: true
  utf-8-validate: false

overrides:
  axios: 1.19.0
  uuid: 11.1.1
  ws: 8.21.0
  '@coinbase/cdp-sdk': 1.52.0
  '@reown/appkit-adapter-wagmi>@wagmi/connectors': 6.2.0
  '@walletconnect/relay-auth>@noble/curves': 1.8.1
  '@walletconnect/relay-auth>@noble/hashes': 1.7.1

minimumReleaseAgeExclude:
  - elliptic@6.6.2
  - ws@8.20.1 || 8.21.0
  - uuid@11.1.1
  - axios@1.18.0
  - nanoid@3.3.18
